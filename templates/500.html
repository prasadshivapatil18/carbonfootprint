{% extends 'base.html' %}

{% block title %}Server Error — CarbonTrack{% endblock %}

{% block content %}
<div class="container-narrow" style="text-align: center; padding: 64px 20px;">
  <div style="font-size: 5rem; font-family: var(--font-heading); font-weight: 800; color: #B87244; line-height: 1;">
    500
  </div>
  <h2 style="margin: 16px 0 12px; color: var(--color-forest-deep);">Something went wrong</h2>
  <p style="max-width: 480px; margin: 0 auto 28px;">
    We encountered an unexpected error while processing your request. Please try again.
  </p>
  <a href="{{ url_for('calculator') }}" class="btn-primary-custom">
    Try Calculator Again
  </a>
</div>
{% endblock %}
