{% extends 'base.html' %}

{% block title %}Page Not Found — CarbonTrack{% endblock %}

{% block content %}
<div class="container-narrow" style="text-align: center; padding: 64px 20px;">
  <div style="font-size: 5rem; font-family: var(--font-heading); font-weight: 800; color: var(--color-forest-primary); line-height: 1;">
    404
  </div>
  <h2 style="margin: 16px 0 12px; color: var(--color-forest-deep);">Page Not Found</h2>
  <p style="max-width: 460px; margin: 0 auto 28px;">
    The page or calculation record you are looking for does not exist or has been removed.
  </p>
  <a href="{{ url_for('index') }}" class="btn-primary-custom">
    Return to Home
  </a>
</div>
{% endblock %}
